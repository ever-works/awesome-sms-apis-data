copyright_year: 2026
name: Awesome SMS APIs
initial_prompt: |-
  A curated directory of SMS, OTP-verification and CPaaS messaging APIs and gateways. Include products such as Twilio, Vonage, Plivo, Sinch, Telnyx, Infobip, Bird, Bandwidth, Textmagic, ClickSend, Africa's Talking, textbee, plus other notable commercial and open-source options. Categories: CPaaS & SMS APIs, Bulk SMS Gateways, Verification & OTP APIs, WhatsApp & RCS APIs, Open-Source SMS Gateways, Regional Providers. For every item capture the official website, a short factual description, pricing model (free, freemium, paid, open source), deployment (cloud or self-hosted), key features and integrations.

  Initial categories: CPaaS & SMS APIs; Bulk SMS Gateways; Verification & OTP APIs; WhatsApp & RCS APIs; Open-Source SMS Gateways; Regional Providers.
  Target keywords: sms api, sms gateway, bulk sms api, twilio alternatives.

  Start with these source lists (use the raw README link for GitHub lists):
  - https://zapier.com/blog/best-sms-app/
  - https://www.softwaresuggest.com/bulk-sms-software
  - https://www.softwaresuggest.com/sms-marketing-software
  - https://github.com/ripienaar/free-for-dev#international-mobile-number-verification-api-and-sdk
  - https://raw.githubusercontent.com/FancyFurret/awesome-sms/HEAD/README.md
  - https://github.com/topics/sms
  - https://github.com/topics/sms-gateway

  Inclusion rules: every item is a real product, service, open-source project or platform in scope; never a statistic, quote, blog post, person or general concept.
  One item per product. The item URL is the official website (never an affiliate link, review-site page or "top 10" article). Skip discontinued products and sites that no longer resolve.
  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for open source state the license and link the repository.
  Each item gets exactly one primary category from the initial categories; do not create near-duplicate categories.
  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid, Enterprise, API, AI-Powered, plus niche-specific ones.
  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt, SourceForge/Slashdot, There's An AI For That or Toolify as sources.
