name: Jasmin
description: Jasmin is a complete open source SMS Gateway written in Python with
  enterprise-class features including SMPP Client/Server, HTTP Client/Server,
  AMQP-based store-and-forward queuing, Redis-backed DLR tracking and billing,
  advanced message routing and filtering, Unicode support, binary SMS, and
  concatenated SMS. It is designed for high traffic loads and full in-memory
  execution, built on Twisted matrix. Released under the Apache License Version
  2.0.
