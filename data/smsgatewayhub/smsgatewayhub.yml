description: SMSGATEWAYHUB is a bulk SMS software platform that enables
  businesses to send group text messages domestically and internationally by
  working with multiple SMS gateway network operators. It serves startups, SMBs,
  mid-market companies, and enterprises with features including contact
  management, API integration, bulk SMS, SMS gateway, reporting and analytics,
  long codes, and secure reliable delivery. Pricing starts at $11 per month for
  the Starter plan on a paid subscription model with cloud deployment.
