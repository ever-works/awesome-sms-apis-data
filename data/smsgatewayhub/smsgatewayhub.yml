markdown: >-
  ## Overview


  SMSGATEWAYHUB is a bulk SMS software platform for businesses that enables
  sending group text messages domestically and internationally. It works with
  different SMS gateway network operators to deliver optimum international
  messaging services.


  ## Target Customers


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises


  ## Features


  - Contact Management

  - Secure And Reliable delivery

  - API Integration

  - Bulk SMS

  - SMS Gateway

  - Reporting And Analytics

  - Long Codes


  ## Pricing


  - Starter Plan: $11 per month


  ## Deployment


  Cloud-based SaaS platform.
