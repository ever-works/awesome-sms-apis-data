markdown: >-
  ## Overview


  GetResponse is an email marketing and marketing automation platform that
  includes SMS marketing capabilities, designed for businesses of any size.


  ## Features


  - Drag-and-drop landing pages

  - Email templates

  - Marketing automation workflows

  - SMS marketing

  - Reliable deliverability

  - User satisfaction scoring based on ease of use, value for money, and
  customer support


  ## Pricing


  Paid service. Pricing tiers mentioned include Max ($165/User/Per Month) and
  Enterprise ($799/User/Per Month). A free trial is available.


  ## User Sentiment


  Users praise GetResponse for ease of use, intuitive interface, reliable
  deliverability, drag-and-drop landing pages, templates, automation, and
  reasonable pricing. Recurring negatives include occasional reporting/dashboard
  accuracy issues and some unspecified problems with the report system.
