markdown: >-
  ## Overview


  SMS-iT is the world's first Agentic AI-powered RAAS platform that unifies CRM,
  ERP, and 60+ microservices to automate sales, marketing, and operations. Built
  for scale, it helps businesses grow predictably with intelligent, all-in-one
  automation.


  ## Features


  - Reporting And Analytics

  - Contact Management

  - Longcodes

  - API Integration

  - Keyword Management

  - Opt In Management

  - Scheduling

  - Autoresponders


  ## Pricing


  Paid commercial service with tiered licensing:

  - Starter: $299 Full Licence/Single User

  - Business: $699 Full Licence/Single User

  - VIP: $999 Full Licence/Single User

  - Enterprise: $1999 Full Licence/Single User


  ## Target Segments


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises
