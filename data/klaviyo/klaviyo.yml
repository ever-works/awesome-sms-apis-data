markdown: >-
  ## Overview


  Klaviyo is a customer data and marketing platform that enables B2C brands to
  engage customers across email, SMS, web interactions, and reviews. It
  transforms customer data into targeted campaigns and is trusted by over
  151,000 businesses.


  ## Features


  - Dynamic Content

  - Email Campaigns

  - SMS Marketing

  - Personalization

  - Reporting And Analytics

  - Signup Forms

  - Segmentation

  - Automation


  ## Pricing


  - Free: $0 per month

  - Email: $20 per month


  ## Deployment


  Cloud-based SaaS platform.
