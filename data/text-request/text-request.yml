markdown: >-
  ## Overview


  Text Request is a fully-featured SMS Marketing Software designed to serve
  enterprises and SMEs. It provides end-to-end solutions designed for web apps.
  This online bulk SMS system offers contact management, mobile coupons, mass
  texting, mobile keywords, and polls/voting in one place.


  ## Features


  - API Integration

  - Group Messaging

  - Message Templates

  - Contact Management

  - Opt Out Management

  - Drip Campaigns

  - Delivery Receipts

  - Longcodes


  ## Pricing


  Paid cloud-based service with monthly subscription tiers:

  - Starter: $49/month

  - Basic: $99/month

  - Corporate: $199/month

  - Enterprise: $450/month


  ## Target Segments


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises
