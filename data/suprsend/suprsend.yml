  - Automated Campaigns

  - Reporting And Analytics

  - User Engagement

  - Delivery Optimization

  - Email Notifications

  - Multi Channel

  - In App Messaging

  - Push Notifications


  ## Pricing


  - Free Plan: $0 Per Month

  - Growth Plan: $99 Per Month

  - Enterprise Plan: $200 Per Month
