markdown: >-
  ## Overview


  Brevo (formerly Sendinblue) is a marketing platform that combines SMS and
  email marketing with built-in CRM operations. All actions are GDPR compliant,
  and the platform can create targeted pages for effortless marketing.


  ## Features


  - Dynamic Content

  - Deliverability Optimization

  - Custom Branding

  - Signup Forms

  - Segmentation

  - Time Tracking

  - A/B Testing

  - Multi User Accounts


  ## Pricing


  - Free: $0 per month

  - Starter: $7 per month

  - Business: $15 per month


  ## Deployment


  Cloud-based SaaS platform.
