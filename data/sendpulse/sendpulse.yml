name: SendPulse
description: SendPulse is a multi-channel marketing platform that helps
  businesses send emails and SMS directly to customers' phones, trigger
  emails/SMS for projects, and send personalized Facebook messages. It includes
  international SMS, contact management, SMS automation, SMS analytics, short
  links, Unicode support, and opt-out management. Pricing includes a Free plan
  at $0/month, Standard at $8/month, and Pro at $10/month.
