markdown: >-
  ## Overview


  SendPulse is a marketing platform enabling businesses to send emails, SMS, and
  Facebook messages to customers.


  ## Features


  - International SMS

  - Contact Management

  - SMS Automation

  - SMS Marketing

  - SMS Analytics

  - Short Links

  - Unicode Support

  - Opt Out Management


  ## Pricing


  - Free: $0/month

  - Standard: $8/month

  - Pro: $10/month


  ## Deployment


  Cloud-based (SaaS)
